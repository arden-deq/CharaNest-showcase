<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">CharaNest system architecture</title>
  <desc id="desc">A desktop user interacts with a sandboxed Electron renderer and preload bridge. The Electron main process coordinates local storage, conversation intelligence, and a managed local LLM sidecar. Approved corrections can be exported to an isolated training and evaluation pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8068ff"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8798"/>
    </marker>
    <style>
      .title { fill: #f0f3f7; font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #9aa5b4; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group { fill: #10161f; stroke: #2d3745; stroke-width: 2; }
      .group-label { fill: #8793a5; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; }
      .box { fill: #171e29; stroke: #394657; stroke-width: 2; }
      .box-accent { fill: #1a2030; stroke: url(#accent); stroke-width: 3; }
      .box-title { fill: #f0f3f7; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-text { fill: #aeb8c6; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { fill: #222b39; stroke: #435067; stroke-width: 1.5; }
      .pill-text { fill: #c8d0db; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #7c8798; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 9; marker-end: url(#arrow); }
      .label { fill: #8b97a8; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="920" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" class="title">CharaNest · Local-first desktop companion</text>
  <text x="80" y="116" class="subtitle">Public-safe architecture overview — source code and model assets remain private</text>

  <rect x="65" y="165" width="1470" height="565" rx="24" class="group"/>
  <text x="95" y="202" class="group-label">DESKTOP APPLICATION · ELECTRON TRUST BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="95" y="270" width="210" height="180" rx="18" class="box-accent"/>
    <text x="200" y="319" text-anchor="middle" class="box-title">User</text>
    <text x="200" y="354" text-anchor="middle" class="box-text">Conversation</text>
    <text x="200" y="379" text-anchor="middle" class="box-text">Avatar interaction</text>
    <text x="200" y="404" text-anchor="middle" class="box-text">Memory controls</text>

    <rect x="365" y="240" width="275" height="240" rx="18" class="box"/>
    <text x="502" y="286" text-anchor="middle" class="box-title">Renderer</text>
    <text x="502" y="319" text-anchor="middle" class="box-text">React · TypeScript</text>
    <text x="502" y="344" text-anchor="middle" class="box-text">Transparent overlay UI</text>
    <rect x="405" y="378" width="195" height="36" rx="18" class="pill"/>
    <text x="502" y="402" text-anchor="middle" class="pill-text">No Node.js privilege</text>
    <rect x="414" y="424" width="177" height="36" rx="18" class="pill"/>
    <text x="502" y="448" text-anchor="middle" class="pill-text">Sandboxed surface</text>

    <rect x="700" y="270" width="225" height="180" rx="18" class="box"/>
    <text x="812" y="319" text-anchor="middle" class="box-title">Preload bridge</text>
    <text x="812" y="354" text-anchor="middle" class="box-text">Narrow IPC surface</text>
    <text x="812" y="379" text-anchor="middle" class="box-text">Payload validation</text>
    <text x="812" y="404" text-anchor="middle" class="box-text">Context isolation</text>

    <rect x="985" y="225" width="485" height="270" rx="18" class="box-accent"/>
    <text x="1227" y="270" text-anchor="middle" class="box-title">Electron main process</text>
    <text x="1227" y="301" text-anchor="middle" class="box-text">Window lifecycle · permissions · orchestration</text>

    <rect x="1020" y="335" width="195" height="115" rx="14" class="pill"/>
    <text x="1117" y="374" text-anchor="middle" class="pill-text">Chat orchestration</text>
    <text x="1117" y="402" text-anchor="middle" class="box-text">Policy · memory</text>
    <text x="1117" y="427" text-anchor="middle" class="box-text">active context</text>

    <rect x="1240" y="335" width="195" height="115" rx="14" class="pill"/>
    <text x="1337" y="374" text-anchor="middle" class="pill-text">Runtime manager</text>
    <text x="1337" y="402" text-anchor="middle" class="box-text">Readiness · logs</text>
    <text x="1337" y="427" text-anchor="middle" class="box-text">process cleanup</text>

    <rect x="1000" y="555" width="280" height="125" rx="18" class="box"/>
    <text x="1140" y="598" text-anchor="middle" class="box-title">Local SQLite</text>
    <text x="1140" y="630" text-anchor="middle" class="box-text">Settings · sessions · memory</text>
    <text x="1140" y="655" text-anchor="middle" class="box-text">events · approved corrections</text>

    <rect x="1310" y="555" width="190" height="125" rx="18" class="box"/>
    <text x="1405" y="598" text-anchor="middle" class="box-title">llama-server</text>
    <text x="1405" y="630" text-anchor="middle" class="box-text">Local GGUF model</text>
    <text x="1405" y="655" text-anchor="middle" class="box-text">Loopback only</text>
  </g>

  <path d="M305 360 H365" class="line"/>
  <path d="M640 360 H700" class="line"/>
  <path d="M925 360 H985" class="line"/>
  <path d="M1140 495 V555" class="line"/>
  <path d="M1337 495 V520 H1405 V555" class="line"/>
  <text x="667" y="342" text-anchor="middle" class="label">validated IPC</text>
  <text x="956" y="342" text-anchor="middle" class="label">commands</text>

  <g filter="url(#shadow)">
    <rect x="300" y="780" width="1000" height="95" rx="20" class="box"/>
    <text x="340" y="818" class="group-label">ISOLATED OFFLINE PIPELINE</text>
    <text x="340" y="851" class="box-title">Approved corrections → privacy cleanup → SFT / DPO export → training &amp; evaluation experiments</text>
  </g>
  <path d="M1000 680 V745 H800 V780" class="dash"/>
  <text x="860" y="738" class="label">explicit user approval only</text>
</svg>
